spring.application.name=englishdaily
#Vectorstore
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.vectorstore.pgvector.initialize-schema=true
#Llama Setup Chat
spring.ai.ollama.chat.enabled=false
#spring.ai.ollama.chat.model=llama3.1
#spring.ai.ollama.chat.model=hf.co/bartowski/DeepSeek-R1-Distill-Llama-8B-GGUF:Q6_K
englishdaily.chat-service.llm-model=none
#OpenAI Setup Chat
spring.ai.openai.chat.enabled=true
spring.ai.openai.embedding.enabled=false
#Liquibase
spring.liquibase.enabled=true
englishdaily.logging-advisor.enabled=true
