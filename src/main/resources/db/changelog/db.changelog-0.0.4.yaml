databaseChangeLog:
  - changeSet:
      id: 5
      comment: Create table grammar_lessons with id auto incremental, title and level as int column
      author: amm
      changes:
        - createTable:
            tableName: grammar_lessons
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: varchar(512)
              - column:
                  name: level
                  type: int

  - changeSet:
      id: 6
      comment: Add courses catalog
      author: amm
