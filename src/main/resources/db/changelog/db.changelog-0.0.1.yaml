databaseChangeLog:
  - changeSet:
      id: create-vector-store-table
      author: amm
      changes:
        - createTable:
            tableName: vector_store
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: "public.uuid_generate_v4()"
                  constraints:
                    primaryKey: true
              - column:
                  name: content
                  type: text
              - column:
                  name: metadata
                  type: json
              - column:
                  name: embedding
                  type: public.vector(768) # 768 is the nomic embedding size

  - changeSet:
      id: create-hnsw-index-on-embedding
      author: amm
      changes:
        - createIndex:
            tableName: vector_store
            indexName: hnsw_embedding_index
            using: HNSW
            columns:
              - column:
                  name: embedding
            additionalOptions: "USING HNSW WITH (vector_cosine_ops)"
